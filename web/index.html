<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PapaBear — book salons, specialists, and shop products.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PapaBear">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>PapaBear</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0D0D0D;
      color: #F2D338;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #pwa-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
    }
    #pwa-splash .mark {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #F2D338;
      color: #0D0D0D;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 28px;
    }
    #pwa-splash .label { letter-spacing: 2px; font-size: 13px; }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAm5bmta_KNZlZBGUlmpmrr-oWP1QYI4_I"></script>
  <script>
    window.__pwaDeferred = null;
    window.__pwaCanInstall = function () { return !!window.__pwaDeferred; };
    window.__pwaStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    };
    window.__pwaInstall = async function () {
      if (!window.__pwaDeferred) return false;
      window.__pwaDeferred.prompt();
      var choice = await window.__pwaDeferred.userChoice;
      window.__pwaDeferred = null;
      return choice.outcome === 'accepted';
    };
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaDeferred = e;
    });
    window.addEventListener('appinstalled', function () {
      window.__pwaDeferred = null;
    });
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('pwa-splash');
      if (el) el.remove();
    });
  </script>
</head>
<body>
  <div id="pwa-splash">
    <div class="mark">P</div>
    <div class="label">PAPABEAR</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
