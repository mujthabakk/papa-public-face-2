name: salon_user
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.11+12

environment:
  sdk: '>=3.5.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  pretty_http_logger: ^1.0.2
  shared_preferences: ^2.2.0
  skeletons: ^0.0.3
  carousel_slider: ^5.1.0
  get: ^4.6.5
  country_code_picker: ^3.0.0
  otp_text_field: ^1.1.3
  google_maps_flutter: ^2.3.1
  flutter_switch: ^0.3.2
  image_picker: ^1.0.0
  geolocator: ^13.0.3
  url_launcher: ^6.1.12
  share_plus: ^10.1.3
  date_picker_timeline: ^1.2.5
  jiffy: ^6.4.3
  connectivity_plus: ^7.0.0
  flutter_multi_formatter: ^2.11.1
  webview_flutter: ^4.2.2
  geocoding: ^2.1.0
  google_nav_bar: ^5.0.6
  flutter_html: ^3.0.0-alpha.6
  flutter_otp_text_field: ^1.1.1
  badges: ^3.1.1
  change_app_package_name: ^1.1.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.2
  flutter_rating_bar: ^4.0.0
  mobile_scanner: ^6.0.0
  #qr_code_dart_scan: ^0.7.3
  photo_view: ^0.14.0 
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  pusher_channels_flutter: ^2.5.0
  flutter_screenutil: ^5.9.0
  facebook_app_events: ^0.27.0
  razorpay_flutter: ^1.4.4
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/sliders/
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: bold
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf

    - family: semibold
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf

    - family: medium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf

    - family: regular
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
